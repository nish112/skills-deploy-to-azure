<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TicTacToe</title>

    <link href="public/index.css" type="text/css" rel="stylesheet" />
    <script src="public/main.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="staff">
        <button
          id="staffIcon"
          type="button"
          aria-expanded="false"
          aria-controls="staffMenu"
          aria-label="Staff profile"
          title="Staff profile"
        >
          <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
            <path
              fill="currentColor"
              d="M9 11a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-3.3 0-6 1.8-6 4v2h12v-2c0-2.2-2.7-4-6-4zm8-2a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm0 2c-.7 0-1.4.1-2 .3 1.8.9 3 2.4 3 4.1V19h5v-2c0-2.2-2.7-4-6-4z"
            />
          </svg>
        </button>
        <div id="staffMenu" role="region" aria-label="Employee profile"></div>
      </div>
      <div>
        <h2 id="turn">It's <span id="player"></span>'s turn!</h2>
        <h2 id="win">
          <span id="winner"></span> wins!
          <button id="newGame">Play again?</button>
        </h2>
      </div>
      <div id="game">
        <table id="tictactoe">
          <tr>
            <td class="0 0"></td>
            <td class="0 1"></td>
            <td class="0 2"></td>
          </tr>
          <tr>
            <td class="1 0"></td>
            <td class="1 1"></td>
            <td class="1 2"></td>
          </tr>
          <tr>
            <td class="2 0"></td>
            <td class="2 1"></td>
            <td class="2 2"></td>
          </tr>
        </table>
        <div id="score">
          <h2>Score</h2>
          <table>
            <thead>
              <tr>
                <th id="p1Name"></th>
                <th id="p2Name"></th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td id="p1Score">0</td>
                <td id="p2Score">0</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
